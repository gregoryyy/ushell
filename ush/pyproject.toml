[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ush"
version = "0.1.0"
description = "ush, the you shell: natural-language // requests for zsh, answered with real commands"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic==2.3.0"]

[project.scripts]
ush = "ush.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
